<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f17" />
    <meta name="description" content="POST (Portal de Soporte Técnico). Monitoreo de sitios industriales, infraestructura, producción, CCTV y RRHH." />
    <title>POST | Portal de Soporte Técnico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Inline theme init to prevent flash
      (function() {
        try {
          var theme = localStorage.getItem('post-theme') || 'dark';
          var mode = localStorage.getItem('post-mode') || 'full';
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute('data-mode', mode);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen bg-background font-sans antialiased">
    <div id="root"></div>
    <!-- Layers for portals -->
    <div id="portal-toast"></div>
    <div id="portal-modal"></div>
    <div id="portal-drawer"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
